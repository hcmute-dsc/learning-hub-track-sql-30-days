spec:
  checklist:
    - "Mỗi lệnh sửa dữ liệu chạy trong `BEGIN ... ROLLBACK` (hoặc đã chạy lại init), nên kết quả `RETURNING` khớp đáp án"
    - "Xem trước bằng `SELECT` với đúng `WHERE` và số dòng psql báo (`UPDATE n`, `DELETE n`) khớp lúc xem trước"
    - "Viết được UPSERT `ON CONFLICT` và `UPDATE ... FROM`"
    - "Đọc được lỗi khóa ngoại khi xóa và đề xuất được cách xử lý thay cho `DELETE`"
