spec:
  checklist:
    - "Chọn được kiểu dữ liệu phù hợp (tiền dùng `NUMERIC`, thời điểm dùng `TIMESTAMPTZ`) và giải thích được vì sao"
    - "Tạo được bảng có khóa chính IDENTITY, `NOT NULL`, `UNIQUE`, `CHECK`, `DEFAULT`, khóa ngoại, và các lệnh sai bị từ chối với đúng tên constraint như đáp án"
    - "Sửa bảng bằng `ALTER TABLE` và kiểm tra lại bằng `\\d`"
    - "Giải thích được kết quả khi xóa dòng cha với `NO ACTION` và `ON DELETE CASCADE`"
